name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test web/test/*.test.mjs

  build-windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller==6.16.0
      - run: pyinstaller --onefile --name keycap-designer --add-data "web;web" start.py
      - uses: actions/upload-artifact@v4
        with:
          name: keycap-designer-windows
          path: dist/keycap-designer.exe
      - name: Release-Asset anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/keycap-designer.exe --title "$GITHUB_REF_NAME" --generate-notes
